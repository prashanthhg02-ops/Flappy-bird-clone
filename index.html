<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8bdcf5">
  <title>Sky Hopper — A Flappy Bird Game</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #d9f5ff;
      color: #173746;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #fff9dd 0, transparent 36rem),
        linear-gradient(160deg, #e7fbff, #a8e6f6 55%, #79c9df);
    }

    main {
      width: min(100vw, 460px);
      padding: 12px;
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 420 / 720;
      border: 5px solid #fff8df;
      border-radius: 28px;
      background: #8bdcf5;
      box-shadow: 0 22px 60px #28647b40, 0 4px 0 #529bb0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      outline: none;
    }

    canvas:focus-visible {
      box-shadow: inset 0 0 0 4px #fff;
    }

    .hint {
      margin: 14px 0 0;
      color: #315d6b;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-align: center;
    }

    @media (max-height: 760px) {
      main { width: min(calc(100vw - 16px), calc((100svh - 54px) * 420 / 720)); }
      .hint { margin-top: 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="game-shell">
      <canvas id="game" width="420" height="720" tabindex="0" role="application" aria-label="Sky Hopper game. Press Space, click, or tap to flap."></canvas>
    </div>
    <p class="hint">SPACE / CLICK / TAP TO FLAP <span aria-hidden="true">·</span> P TO PAUSE</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const groundY = 632;
      const bird = { x: 112, y: 320, velocity: 0, radius: 17, rotation: 0 };
      const pipeWidth = 76;
      const pipeGap = 180;
      const pipes = [];
      const clouds = [
        { x: 62, y: 142, scale: 1 },
        { x: 300, y: 232, scale: .72 },
        { x: 194, y: 72, scale: .55 }
      ];

      let state = "ready";
      let score = 0;
      let best = 0;
      let frame = 0;
      let groundOffset = 0;
      let lastTime = 0;

      try {
        best = Number(localStorage.getItem("sky-hopper-best")) || 0;
      } catch (error) {
        console.warn("Could not read the saved high score.", error);
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fill();
      }

      function drawCloud(x, y, scale, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.ellipse(0, 10, 36, 17, 0, 0, Math.PI * 2);
        ctx.ellipse(-20, 7, 18, 14, 0, 0, Math.PI * 2);
        ctx.ellipse(3, -3, 22, 22, 0, 0, Math.PI * 2);
        ctx.ellipse(24, 7, 17, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#79d5f2");
        sky.addColorStop(.7, "#b7eff5");
        sky.addColorStop(1, "#e9f8d6");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#fff4bd";
        ctx.beginPath();
        ctx.arc(335, 126, 43, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff9d9";
        ctx.beginPath();
        ctx.arc(335, 126, 34, 0, Math.PI * 2);
        ctx.fill();

        clouds.forEach((cloud, index) => {
          const drift = state === "playing" ? (frame * (index === 1 ? .12 : .07)) % 500 : 0;
          const x = ((cloud.x - drift + 500) % 500) - 40;
          drawCloud(x, cloud.y, cloud.scale, .86);
        });

        ctx.fillStyle = "#83d1a7";
        ctx.beginPath();
        ctx.moveTo(0, 528);
        ctx.quadraticCurveTo(94, 451, 190, 526);
        ctx.quadraticCurveTo(305, 426, 420, 516);
        ctx.lineTo(420, groundY);
        ctx.lineTo(0, groundY);
        ctx.fill();
        ctx.fillStyle = "#65bf9b";
        ctx.beginPath();
        ctx.moveTo(0, 565);
        ctx.quadraticCurveTo(115, 501, 232, 566);
        ctx.quadraticCurveTo(329, 492, 420, 551);
        ctx.lineTo(420, groundY);
        ctx.lineTo(0, groundY);
        ctx.fill();
      }

      function drawPipe(pipe) {
        const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
        gradient.addColorStop(0, "#45aa58");
        gradient.addColorStop(.28, "#82db66");
        gradient.addColorStop(.72, "#63c85c");
        gradient.addColorStop(1, "#32934d");
        ctx.fillStyle = gradient;

        const topHeight = pipe.top;
        const bottomY = pipe.top + pipeGap;
        const capHeight = 25;
        roundedRect(pipe.x + 5, -8, pipeWidth - 10, topHeight - capHeight + 8, 9);
        roundedRect(pipe.x, topHeight - capHeight, pipeWidth, capHeight, 7);
        roundedRect(pipe.x + 5, bottomY + capHeight, pipeWidth - 10, groundY - bottomY - capHeight, 9);
        roundedRect(pipe.x, bottomY, pipeWidth, capHeight, 7);

        ctx.fillStyle = "#ffffff2b";
        ctx.fillRect(pipe.x + 12, 0, 8, Math.max(0, topHeight - capHeight));
        ctx.fillRect(pipe.x + 12, bottomY + capHeight, 8, groundY - bottomY - capHeight);
      }

      function drawGround() {
        ctx.fillStyle = "#f4d477";
        ctx.fillRect(0, groundY, W, H - groundY);
        ctx.fillStyle = "#b8d95c";
        ctx.fillRect(0, groundY, W, 15);
        ctx.fillStyle = "#8fc74f";
        ctx.fillRect(0, groundY, W, 6);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, groundY + 15, W, H - groundY - 15);
        ctx.clip();
        ctx.fillStyle = "#e8bd60";
        for (let x = -34 - groundOffset; x < W + 40; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, groundY + 32);
          ctx.lineTo(x + 19, groundY + 20);
          ctx.lineTo(x + 30, groundY + 20);
          ctx.lineTo(x + 11, groundY + 32);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawBird() {
        const bob = state === "ready" ? Math.sin(frame / 12) * 7 : 0;
        ctx.save();
        ctx.translate(bird.x, bird.y + bob);
        ctx.rotate(bird.rotation);
        ctx.fillStyle = "#d99435";
        ctx.beginPath();
        ctx.ellipse(-4, 4, 20, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffd45e";
        ctx.beginPath();
        ctx.ellipse(-5, 0, 18, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff1c2";
        ctx.beginPath();
        ctx.ellipse(-8, 7, 10, 7, -.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f5a946";
        ctx.beginPath();
        ctx.ellipse(-12, 2, 9, 6, Math.sin(frame / 5) * .16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e9794a";
        ctx.beginPath();
        ctx.moveTo(12, -3);
        ctx.lineTo(29, 1);
        ctx.lineTo(12, 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(7, -8, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#253f50";
        ctx.beginPath();
        ctx.arc(9, -8, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawScore() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "900 54px Trebuchet MS, sans-serif";
        ctx.lineJoin = "round";
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#518a9c";
        ctx.strokeText(String(score), W / 2, 90);
        ctx.fillStyle = "#fffdf0";
        ctx.fillText(String(score), W / 2, 90);
        ctx.restore();
      }

      function drawPanel(title, subtitle, buttonText) {
        ctx.fillStyle = "#153f5066";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff9e9";
        roundedRect(40, 205, W - 80, 296, 28);
        ctx.fillStyle = "#e9f7ed";
        roundedRect(49, 214, W - 98, 278, 22);

        ctx.textAlign = "center";
        ctx.fillStyle = "#2d5968";
        ctx.font = "900 36px Trebuchet MS, sans-serif";
        ctx.fillText(title, W / 2, 270);
        ctx.fillStyle = "#64828a";
        ctx.font = "600 16px Trebuchet MS, sans-serif";
        ctx.fillText(subtitle, W / 2, 304);

        if (state === "over") {
          ctx.fillStyle = "#6b8790";
          ctx.font = "700 14px Trebuchet MS, sans-serif";
          ctx.fillText("SCORE", 145, 354);
          ctx.fillText("BEST", 275, 354);
          ctx.fillStyle = "#274e5c";
          ctx.font = "900 31px Trebuchet MS, sans-serif";
          ctx.fillText(String(score), 145, 392);
          ctx.fillText(String(best), 275, 392);
        }

        const buttonY = state === "over" ? 420 : 380;
        ctx.fillStyle = "#e69539";
        roundedRect(105, buttonY + 5, 210, 57, 18);
        ctx.fillStyle = "#ffc653";
        roundedRect(105, buttonY, 210, 57, 18);
        ctx.fillStyle = "#fffdf0";
        ctx.font = "900 20px Trebuchet MS, sans-serif";
        ctx.fillText(buttonText, W / 2, buttonY + 36);
        ctx.fillStyle = "#6f939b";
        ctx.font = "600 13px Trebuchet MS, sans-serif";
        ctx.fillText("SPACE  /  CLICK  /  TAP", W / 2, 474);
      }

      function drawPause() {
        ctx.fillStyle = "#153f5066";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff9e9";
        roundedRect(64, 270, W - 128, 154, 24);
        ctx.textAlign = "center";
        ctx.fillStyle = "#2d5968";
        ctx.font = "900 34px Trebuchet MS, sans-serif";
        ctx.fillText("PAUSED", W / 2, 330);
        ctx.fillStyle = "#64828a";
        ctx.font = "600 15px Trebuchet MS, sans-serif";
        ctx.fillText("Press P or tap to keep flying", W / 2, 370);
      }

      function addPipe() {
        const margin = 82;
        const top = margin + Math.random() * (groundY - pipeGap - margin * 2);
        pipes.push({ x: W + 12, top, scored: false });
      }

      function flap() {
        bird.velocity = -7.1;
        bird.rotation = -.38;
      }

      function startGame() {
        score = 0;
        pipes.length = 0;
        bird.y = 320;
        bird.velocity = 0;
        bird.rotation = 0;
        frame = 0;
        addPipe();
        state = "playing";
        flap();
      }

      function endGame() {
        state = "over";
        if (score > best) {
          best = score;
          try {
            localStorage.setItem("sky-hopper-best", String(best));
          } catch (error) {
            console.warn("Could not save the high score.", error);
          }
        }
      }

      function togglePause() {
        if (state === "playing") state = "paused";
        else if (state === "paused") state = "playing";
      }

      function handleAction() {
        canvas.focus({ preventScroll: true });
        if (state === "ready" || state === "over") startGame();
        else if (state === "paused") state = "playing";
        else if (state === "playing") flap();
      }

      function update(delta) {
        frame += delta;
        if (state !== "playing") return;
        const step = Math.min(delta / 16.67, 2);
        bird.velocity += .38 * step;
        bird.y += bird.velocity * step;
        bird.rotation = Math.min(.95, bird.rotation + .035 * step);
        groundOffset = (groundOffset + 2.8 * step) % 40;

        for (const pipe of pipes) {
          pipe.x -= 2.8 * step;
          if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
            pipe.scored = true;
            score += 1;
          }
          const overlapsBird = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth;
          if (overlapsBird && (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.top + pipeGap)) {
            endGame();
            break;
          }
        }

        while (pipes.length && pipes[0].x + pipeWidth < -10) pipes.shift();
        if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 225) addPipe();
        if (bird.y - bird.radius < 0 || bird.y + bird.radius > groundY) endGame();
      }

      function render() {
        drawBackground();
        pipes.forEach(drawPipe);
        drawGround();
        drawBird();
        if (state === "playing" || state === "paused") drawScore();
        if (state === "ready") drawPanel("SKY HOPPER", "A little bird. A big adventure.", "START FLYING");
        if (state === "over") drawPanel("NICE TRY!", "Every flight is a new adventure.", "FLY AGAIN");
        if (state === "paused") drawPause();
      }

      function loop(timestamp) {
        const delta = lastTime ? Math.min(timestamp - lastTime, 50) : 16.67;
        lastTime = timestamp;
        update(delta);
        render();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        handleAction();
      });
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          if (!event.repeat) handleAction();
        } else if (event.key.toLowerCase() === "p" && !event.repeat) {
          togglePause();
        }
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
